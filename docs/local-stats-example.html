<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dune Companion · Offline stats example</title><style>
  :root{--ink:#0a0806;--fire:#ff6820;--ember:#d04010;--ash:#8a3a0a;--char:#1e0e04}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--ink);color:var(--fire);font-family:ui-monospace,Menlo,Consolas,monospace;padding:18px 16px 40px}
  h1{font-size:15px;letter-spacing:3px;margin:0 0 2px}.sub{font-size:11px;letter-spacing:2px;color:var(--ash);margin:0 0 18px}
  h2{font-size:11px;letter-spacing:3px;color:var(--ash);margin:22px 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:block;color:var(--ash);font-size:10px;letter-spacing:2px;margin:12px 0 5px}
  select,input,button{font:inherit;font-weight:800;color:var(--fire);background:var(--char);border:1px solid var(--ash);border-radius:10px;width:100%;padding:16px 8px}
  button{font-size:15px;letter-spacing:1.5px;cursor:pointer}button:active{background:var(--ash);color:var(--ink)}button:disabled{opacity:.3}
  input{font-size:13px;margin-top:6px;padding:12px 8px}input::placeholder{color:var(--ash)}
  .wide{grid-column:1/3}.primary{border-color:var(--fire);font-size:19px;padding:22px 8px}.stop{color:var(--ember);border-color:var(--ember)}
  #status{border:1px solid var(--ash);border-radius:10px;padding:16px;margin-bottom:14px;text-align:center;letter-spacing:1px}
  .meta{font-size:12px;color:var(--ash);letter-spacing:2px}.phase{font-size:22px;font-weight:900;margin:8px 0}.player{font-size:18px;font-weight:900}
  #turnTimer{font-size:54px;font-weight:900;line-height:1.15;margin:10px 0;color:var(--fire)}#turnTimer.pulse{animation:pulse .8s infinite alternate}#gameTimer{font-size:24px;font-weight:900;margin-top:12px;color:var(--fire)}@keyframes pulse{to{opacity:.3}}
  .players{display:grid;gap:7px;margin:10px 0}.playerRow{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;border-bottom:1px solid #3b1b0a;padding:8px 0}.rowBtns{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;gap:6px}.playerRow button{font-size:11px;padding:11px 4px}.done{opacity:.45}.turnOrder{font-size:11px;letter-spacing:1px;color:var(--ash);border:1px solid #3b1b0a;border-radius:8px;padding:10px;margin:12px 0;line-height:1.6}.scoreCard{border:1px solid var(--fire);border-radius:10px;padding:14px;margin:14px 0}.scoreRow{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center}.scoreRow input{margin:4px 0}.scoreRow input.missing{border-color:#ff4d2e;background:#2a0f06}.scoreCard select{margin:8px 0}
  #game{display:none}#toast{position:fixed;left:0;right:0;bottom:0;background:var(--fire);color:var(--ink);text-align:center;padding:14px;font-weight:800;letter-spacing:2px;transform:translateY(100%);transition:transform .18s}#toast.show{transform:translateY(0)}
  a.back{display:inline-block;color:var(--ash);text-decoration:none;font-size:11px;letter-spacing:2px;margin-bottom:14px}
  details{margin:22px 0 8px}summary{font-size:11px;letter-spacing:3px;color:var(--ash);cursor:pointer;padding:10px 0;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:'▸ '}details[open] summary::before{content:'▾ '}
  #tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}#tabs button{font-size:12px;padding:12px 4px}#tabs button.on{background:var(--fire);color:var(--ink);border-color:var(--fire)}
  .tab{display:none}.tab.on{display:block}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{border:1px solid #3b1b0a;border-radius:8px;padding:10px}.tile b{display:block;font-size:20px;margin-top:4px}.tile span{font-size:10px;letter-spacing:2px;color:var(--ash)}
  .scroll{overflow-x:auto;margin:6px 0}table{border-collapse:collapse;width:100%;font-size:12px}th{font-size:9px;letter-spacing:1.5px;color:var(--ash);text-align:right;font-weight:400;padding:6px 4px;white-space:nowrap}th:first-child,td:first-child{text-align:left}td{text-align:right;padding:7px 4px;border-top:1px solid #3b1b0a;white-space:nowrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
  .bar{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;font-size:11px;margin:4px 0}.bar i{display:block;height:12px;background:var(--ember);border-radius:3px}.bar i.max{background:var(--fire)}
  .game{border:1px solid #3b1b0a;border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;font-size:12px;line-height:1.6}.game .meta{font-size:10px}
  .note{font-size:11px;color:var(--ash);letter-spacing:1px;line-height:1.6}a.btn{display:block;text-align:center;text-decoration:none;font-weight:800;color:var(--fire);background:var(--char);border:1px solid var(--ash);border-radius:10px;padding:16px 8px;letter-spacing:1.5px;font-size:15px}
  #guide{font-size:13px;line-height:1.65;color:#f0b890}#guide h2{margin-top:26px}#guide b{color:var(--fire)}#guide ul{padding-left:18px;margin:6px 0}#guide li{margin:4px 0}#guide p{margin:6px 0}
  #autoAdvance{display:none;border:1px solid #3b1b0a;border-radius:10px;padding:12px;margin:-4px 0 14px;text-align:center;font-size:12px;letter-spacing:2px;font-weight:800}#autoAdvance .track{height:8px;border-radius:4px;background:var(--char);margin-top:8px;overflow:hidden}#autoAdvance .fill{height:100%;background:var(--ember)}
  #testbar{display:none;background:#ffb000;color:#1a0d00;font-weight:900;letter-spacing:2px;text-align:center;padding:12px;border-radius:8px;margin-bottom:14px;font-size:12px;line-height:1.5}

body{max-width:720px;margin:auto}#tabs .on{border-color:var(--fire)}</style><h1>GAME COMPANION</h1><p class="sub">DUNE: IMPERIUM · LOCAL STATS</p><nav id="tabs"><button>GAME</button><button class="on">STATS</button><button>GUIDE</button></nav><p class="note">OFFLINE EXAMPLE · FICTIONAL GAME DATA AND SEAT NAMES.<br>Rendered with the app's stats code. This preview has no connection to a phone.</p><h2>FINISHED GAME</h2><main id="example"></main><script>var SEAT_COLOURS={blue:'#4a8fff',green:'#3fbf5f',red:'#ff4d4d',yellow:'#ffd23a'};function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dur(ms){var t=Math.max(0,Math.round((ms||0)/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),q=t%60;return h?h+'h '+String(m).padStart(2,'0')+'m':m+':'+String(q).padStart(2,'0')}
function pct(x){return Math.round((x||0)*100)+'%'}
function dot(seat){return '<i class="dot" style="background:'+(SEAT_COLOURS[seat]||'#888')+'"></i>'}function gameStatsHtml(st){
 var h='<div class="tiles"><div class="tile"><span>GAME TIME</span><b>'+dur(st.gameMs)+'</b></div><div class="tile"><span>ROUNDS</span><b>'+st.rounds+'</b></div><div class="tile"><span>TURNS</span><b>'+st.turns+'</b></div><div class="tile"><span>AVG TURN</span><b>'+dur(st.averageTurnMs)+'</b></div></div>';
 if(st.winnerName)h+='<p class="note" style="margin-top:10px">WINNER · '+dot(st.winner)+'<b>'+esc(st.winnerName)+'</b></p>';
 h+='<h2>TURN TIME BY PLAYER</h2><div class="scroll"><table><tr><th>PLAYER</th><th>TURNS</th><th>TIME</th><th>SHARE</th><th>AVG</th><th>LONGEST</th><th>VP</th></tr>'+st.seats.map(function(s){return '<tr><td>'+dot(s.seat)+esc(s.name)+(s.winner?' ★':'')+'</td><td>'+s.turns+'</td><td>'+dur(s.totalMs)+'</td><td>'+pct(s.share)+'</td><td>'+dur(s.averageMs)+'</td><td>'+dur(s.longestMs)+'</td><td>'+(s.victoryPoints==null?'–':s.victoryPoints)+'</td></tr>'}).join('')+'</table></div>';
 h+='<h2>AGENT · REVEAL</h2><div class="scroll"><table><tr><th>TURN</th><th>COUNT</th><th>AVG</th><th>TIME</th><th>SHARE</th></tr>'+st.kinds.map(function(k){return '<tr><td>'+k.kind.toUpperCase()+'</td><td>'+k.turns+'</td><td>'+dur(k.averageMs)+'</td><td>'+dur(k.totalMs)+'</td><td>'+pct(k.share)+'</td></tr>'}).join('')+'</table></div>';
 if(st.roundTimes.length){var max=Math.max.apply(null,st.roundTimes.map(function(r){return r.turnTimeMs}))||1;
  h+='<h2>TURN TIME BY ROUND</h2>'+st.roundTimes.map(function(r){return '<div class="bar"><span>R'+r.round+'</span><i class="'+(r.round===st.slowestRound?'max':'')+'" style="width:'+Math.max(2,Math.round(r.turnTimeMs/max*100))+'%"></i><span style="text-align:right">'+dur(r.turnTimeMs)+'</span></div>'}).join('')}
 if(st.checkpoints.length)h+='<h2>VICTORY POINTS</h2>'+vpChart(st)+'<div class="scroll"><table><tr><th>PLAYER</th>'+st.checkpoints.map(function(c){return '<th>'+(c.final?'FINAL':'C'+c.conflict)+'</th>'}).join('')+'</tr>'+st.seats.map(function(s){return '<tr><td>'+dot(s.seat)+esc(s.name)+'</td>'+st.checkpoints.map(function(c){var v=c.victoryPoints[s.seat];return '<td>'+(v==null?'–':v)+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>';
 return h}
// Points only exist at the checkpoints (conflicts 5, 9, 10), so the line starts from zero at
// the first conflict and joins what was recorded. Drawn inline: the panel may be on a hotspot
// with no internet, so there is no chart library to fetch.
function vpChart(st){
 var W=320,H=150,L=24,R=10,T=10,B=22,pts=[{conflict:0,victoryPoints:{}}].concat(st.checkpoints),max=4;
 st.checkpoints.forEach(function(c){for(var k in c.victoryPoints)max=Math.max(max,c.victoryPoints[k])});max=Math.ceil((max+1)/2)*2;
 function x(c){return L+(W-L-R)*c/10}function y(v){return T+(H-T-B)*(1-v/max)}
 var g='';for(var v=0;v<=max;v+=2)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#3b1b0a"/><text x="'+(L-6)+'" y="'+(y(v)+3)+'" fill="#8a3a0a" font-size="9" text-anchor="end">'+v+'</text>';
 pts.forEach(function(p){if(p.conflict)g+='<text x="'+x(p.conflict)+'" y="'+(H-6)+'" fill="#8a3a0a" font-size="9" text-anchor="middle">'+p.conflict+'</text>'});
 // Each seat is nudged a pixel or two off the others so tied scores don't hide a line.
 st.seats.forEach(function(s,i){var c=SEAT_COLOURS[s.seat]||'#888',d=(i-(st.seats.length-1)/2)*2.2,line=pts.map(function(p){return x(p.conflict)+','+(y(p.victoryPoints[s.seat]||0)+d)}).join(' ');
  g+='<polyline points="'+line+'" fill="none" stroke="'+c+'" stroke-width="2"/>'+pts.slice(1).map(function(p){return '<circle cx="'+x(p.conflict)+'" cy="'+(y(p.victoryPoints[s.seat]||0)+d)+'" r="3" fill="'+c+'"/>'}).join('')});
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Victory points by conflict">'+g+'</svg>'}

document.getElementById("example").innerHTML=gameStatsHtml({"gameMs": 10800000, "rounds": 10, "turns": 80, "averageTurnMs": 120000, "winner": "blue", "winnerName": "Blue", "seats": [{"seat": "blue", "name": "Blue", "turns": 20, "totalMs": 3000000, "share": 0.3125, "averageMs": 150000.0, "longestMs": 300000, "victoryPoints": 11, "winner": true}, {"seat": "red", "name": "Red", "turns": 20, "totalMs": 2400000, "share": 0.25, "averageMs": 120000.0, "longestMs": 260000, "victoryPoints": 9, "winner": false}, {"seat": "green", "name": "Green", "turns": 20, "totalMs": 2280000, "share": 0.2375, "averageMs": 114000.0, "longestMs": 240000, "victoryPoints": 8, "winner": false}, {"seat": "yellow", "name": "Yellow", "turns": 20, "totalMs": 1920000, "share": 0.2, "averageMs": 96000.0, "longestMs": 220000, "victoryPoints": 7, "winner": false}], "kinds": [{"kind": "agent", "turns": 60, "averageMs": 120000, "totalMs": 7200000, "share": 0.75}, {"kind": "reveal", "turns": 20, "averageMs": 120000, "totalMs": 2400000, "share": 0.25}], "roundTimes": [{"round": 1, "turnTimeMs": 720000}, {"round": 2, "turnTimeMs": 840000}, {"round": 3, "turnTimeMs": 900000}, {"round": 4, "turnTimeMs": 960000}, {"round": 5, "turnTimeMs": 1020000}, {"round": 6, "turnTimeMs": 1080000}, {"round": 7, "turnTimeMs": 1260000}, {"round": 8, "turnTimeMs": 1140000}, {"round": 9, "turnTimeMs": 900000}, {"round": 10, "turnTimeMs": 780000}], "slowestRound": 7, "checkpoints": [{"conflict": 5, "final": false, "victoryPoints": {"blue": 6, "red": 5, "green": 4, "yellow": 3}}, {"conflict": 9, "final": false, "victoryPoints": {"blue": 9, "red": 8, "green": 7, "yellow": 6}}, {"conflict": 10, "final": true, "victoryPoints": {"blue": 11, "red": 9, "green": 8, "yellow": 7}}]});</script></html>
